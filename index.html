<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API de Gatos - Taller JAP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light text-center p-5">
  <h1 class="mb-4">🐱 Conexión a la API de Gatitos 🐱</h1>
  <p class="text-muted">😺 Cada vez que apretes el botón, vas a ver una nueva imagen aleatoria de un gato 😺</p>

  <button id="btn" class="btn btn-primary mb-4">Ver un gatito</button>

  <div id="resultado" class="p-3 bg-white shadow rounded w-75 mx-auto">
    <p class="text-secondary">Acá va a aparecer tu gatito</p>
  </div>

  <script>
    const boton = document.getElementById("btn");
    const contenedor = document.getElementById("resultado");

    boton.addEventListener("click", obtenerGato);

    function obtenerGato() {
      fetch("https://api.thecatapi.com/v1/images/search")
        .then(response => response.json())
        .then(data => {
          const imagen = data[0].url;
          contenedor.innerHTML = `
            <img src="${imagen}" alt="Gato aleatorio" class="img-fluid rounded shadow-sm">
          `;
        })
        .catch(error => {
          contenedor.innerHTML = `<p class="text-danger">Ocurrió un error al cargar el gato 😿</p>`;
          console.error("Error:", error);
        });
    }
  </script>
</body>
</html>
